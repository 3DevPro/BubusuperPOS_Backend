name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest

    # tests/conftest.py connects to postgresql+asyncpg://loyverse:loyverse@localhost:5433/loyverse_test
    # and builds the schema itself with Base.metadata.create_all, so an empty
    # database is all this needs — no alembic run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loyverse
          POSTGRES_PASSWORD: loyverse
          POSTGRES_DB: loyverse_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U loyverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # matches the Dockerfile
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
